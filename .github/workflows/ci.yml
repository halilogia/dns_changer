name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ruff==0.16.9
      - name: Ruff check
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Icon is reproducible
        run: |
          python tools/make_icon.py
          git diff --exit-code -- packaging/icon.ico

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Import check
        run: python -c "import core.system, core.providers, core.resolver, core.dns_service, core.elevation, diagnostics.report, ui.app; print('imports ok')"
      - name: CLI smoke test
        run: python main.py providers
      - name: CLI adapter listing
        run: python main.py adapters
      - name: CLI diagnostics (quick)
        run: python main.py diagnostics --quick

  build:
    name: Build Windows executables
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build
        shell: pwsh
        run: ./packaging/build.ps1 -Clean
      - name: Assert UAC execution levels
        run: |
          python tools/check_manifest.py dist/ApexDNSChanger.exe dist/ApexDNSDiagnostics.exe
      - name: Frozen CLI smoke test
        run: |
          ./dist/ApexDNSDiagnostics.exe providers
          ./dist/ApexDNSDiagnostics.exe --version
      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: apex-dns-changer-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
